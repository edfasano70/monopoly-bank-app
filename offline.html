<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020617">
<title>Sin conexión · Monopoly Wallet</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #020617;
    color: #e2e8f0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%;
    max-width: 360px;
    border-radius: 20px;
    background: #0f172a;
    padding: 28px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  }
  img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    display: block;
    margin: 0 auto 18px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 22px; color: #94a3b8; line-height: 1.5; }
  button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    background: #059669;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #047857; }
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="Monopoly Wallet">
  <h1>Sin conexión</h1>
  <p>No hay conexión a Internet. Vuelve a intentarlo cuando estés en línea.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
